[project]
name = "retrieval-and-reranking"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "vijaymultiverse", email = "vijay@aimultiverseapps.com" }
]
requires-python = ">=3.14"
dependencies = [
    "langchain-core>=1.8.2",
    "langchain-google-genai>=4.5.0",
    "langchain-mcp-adapters>=0.3.2",
    "langgraph>=1.2.22",
    "mcp>=1.30.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.2.4",
]

[project.scripts]
start = "retrieval_and_reranking:main"
run = "retrieval_and_reranking:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
